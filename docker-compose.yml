# Local infra for Tarf. Host ports are offset to avoid clashing with other projects.
name: tarf
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: tarf, POSTGRES_PASSWORD: tarf, POSTGRES_DB: tarf }
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tarf"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment: { MEILI_MASTER_KEY: change-me-master-key, MEILI_ENV: development }
    ports: ["7700:7700"]
    volumes: [meilidata:/meili_data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: tarfminio, MINIO_ROOT_PASSWORD: tarfminio123 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes: { pgdata: {}, meilidata: {}, miniodata: {} }
